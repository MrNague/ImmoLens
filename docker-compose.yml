# docker-compose.yml
services:
  train:
    build: .
    profiles: ["training"]
    volumes:
      - ./modelle:/app/modelle
      - ./mlruns:/app/mlruns
    command: python train.py

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./modelle:/app/modelle
    command: python api.py

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
